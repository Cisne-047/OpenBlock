# El constructor web (web/) publicado en GitHub Pages.
#
# Igual que DistroForge despliega su app en cada push a main, esto recompila
# el pkg de WASM desde el fuente y publica web/ —la página no depende de ningún
# artefacto versionado: lo que se sirve es lo que sale de compilar el commit.
#
# El plan de descargas NO se resuelve en la página (CORS): la página pega el
# `forge plan` local, así que no hay secretos ni proxies aquí.

name: web

on:
  push:
    branches: [main]
    paths:
      - "rust/crates/forge-core/**"
      - "rust/crates/forge-wasm/**"
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # la action empaqueta versiones viejas de wasm-pack que no entienden
      # `version.workspace` del Cargo.toml; la misma 0.15 que se usa en local
      - name: wasm-pack 0.15 (binario, como en local)
        run: |
          curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz             | tar xz --strip-components=1
          mv wasm-pack ~/.cargo/bin/wasm-pack
          wasm-pack --version

      - name: compilar el pkg
        run: wasm-pack build rust/crates/forge-wasm --target web --out-dir ../../web/pkg

      # el GITHUB_TOKEN no puede crear el site de Pages desde una acción
      # ("Resource not accessible by integration"), así que se despliega a la
      # rama gh-pages y Pages se sirve de ahí. Paso único a mano, una vez:
      #   Settings → Pages → Source: Deploy from a branch → gh-pages / (root)
      - name: publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web
          force_orphan: true
