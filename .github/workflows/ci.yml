name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    # CLI TypeScript: type-check + suite vitest (incluye el doctor end-to-end).
    # `tests/detect.test.ts` compara la detección de hardware de Rust contra la de
    # Node **en la misma máquina**, así que necesita el binario compilado: de ahí
    # el paso del toolchain de Rust en este job.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Toolchain de Rust (para el test de detección)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Dependencias
        run: npm ci
      - name: Compila el CLI de Rust (lo usa tests/detect.test.ts)
        run: cargo build --manifest-path rust/Cargo.toml
      - name: Tipos
        run: npm run typecheck
      - name: Compila (dist/ es lo que se instala)
        run: npm run build
      - name: Tests
        run: npm test

  rust:
    # Paridad del núcleo Rust contra el TS. El golden lo genera el TypeScript, así
    # que si alguien cambia un generador en un lado y no en el otro, esto falla y
    # dice el fichero, la línea y el byte. Mismo gate que el clippy de DistroForge.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20 (el golden lo genera el TS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Dependencias del TS
        run: npm ci
        working-directory: .
      - name: Regenera el golden de paridad
        run: npm run parity:golden
        working-directory: .
      - name: El golden está al día (si no, el TS cambió y no se regeneró)
        run: git diff --exit-code -- rust/crates/forge-core/tests/golden rust/crates/forge-api/tests/golden
        working-directory: .
      - name: Tests del núcleo
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Formato
        run: cargo fmt --check

  installers:
    # Los instaladores también son código, y nadie los ejecutaba. Por ahí se coló
    # que `install.ps1` se quedara sin BOM: Windows PowerShell 5.1 lee los .ps1 sin
    # BOM como ANSI, las vocales acentuadas y el ✓ se le vuelven comillas
    # tipográficas —que acepta como delimitador de cadena— y el script deja de
    # compilar. Con `pwsh` 7 y con `irm | iex` funcionaba, así que solo se veía al
    # ejecutarlo desde disco en la PowerShell de serie, que es la que trae Windows.
    # Aquí se comprueba en los dos sistemas y sin descargar nada.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: install.sh compila (sh -n)
        if: runner.os == 'Linux'
        run: sh -n install.sh
      - name: install.ps1 compila y dice dónde instalaría
        if: runner.os == 'Windows'
        shell: powershell
        run: .\install.ps1 -DryRun

  smoke:
    # Instala un Paper de verdad, lo arranca y lo diagnostica. Es el único job que
    # toca un server real: la suite unitaria nunca arranca uno, y por ahí se coló
    # un bug (`--yes` dejó de aplicar fixes) que 77 tests daban por bueno.
    # Es el equivalente del smoke test de QEMU que DistroForge corre sobre su ISO.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Java 21 (Paper 1.20.4+ lo exige)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dependencias
        run: npm ci
      - name: Instala, arranca y diagnostica un server real
        run: npm run smoke
