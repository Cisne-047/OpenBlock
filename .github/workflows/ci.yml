name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    # CLI TypeScript: type-check + suite vitest (incluye el doctor end-to-end)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Tipos
        run: npm run build
      - name: Tests
        run: npm test
