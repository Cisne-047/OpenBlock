[package]
name = "forge-cli"
description = "CLI de OpenBlock en Rust."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core" }
forge-api = { path = "../forge-api" }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# md-5: UUID offline (md5 de "OfflinePlayer:<nombre>", versión 3) para whitelist/op
md-5 = "0.10"

[dev-dependencies]
sha2 = "0.10"
